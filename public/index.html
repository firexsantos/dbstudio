<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBStudio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='40' y2='40'%3E%3Cstop stop-color='%238b5cff'/%3E%3Cstop offset='.55' stop-color='%2336d6ff'/%3E%3Cstop offset='1' stop-color='%232dffb3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='%2307080f'/%3E%3Cg stroke='url(%23g)' stroke-width='2.4' fill='none' stroke-linecap='round'%3E%3Cellipse cx='20' cy='12.5' rx='8' ry='3'/%3E%3Cpath d='M12 12.5v15c0 1.7 3.6 3 8 3s8-1.3 8-3v-15'/%3E%3Cpath d='M12 20c0 1.7 3.6 3 8 3s8-1.3 8-3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="/vendor/codemirror/addon/hint/show-hint.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="aurora a4"></div>
  <div class="dots"></div><div class="grain"></div>
</div>

<div id="app" class="intro">
  <nav id="rail" class="glass">
    <div class="rail-logo" title="Command palette (Ctrl+K)"></div>
    <div class="rail-items">
      <div class="rail-indicator"></div>
      <button class="rail-btn" data-panel="connections" title="Connections"></button>
      <button class="rail-btn" data-panel="explorer" title="Explorer"></button>
      <button class="rail-btn" data-panel="tools" title="Tools — every feature"></button>
      <button class="rail-btn" data-panel="jobs" title="Background jobs"><span class="badge-dot" hidden>0</span></button>
      <span class="rail-sep"></span>
      <button class="rail-btn" data-tool="qb" title="Visual Query Builder"></button>
      <button class="rail-btn" data-tool="erd" title="ERD — relation diagram"></button>
      <button class="rail-btn" data-tool="datasync" title="Data sync"></button>
    </div>
    <div class="rail-bottom">
      <button class="rail-btn" id="btn-settings" title="Settings (Ctrl+,)"></button>
      <button class="rail-btn" id="btn-about" title="About DBStudio & the developer"></button>
      <button class="rail-btn" id="btn-palette" title="Command palette (Ctrl+K)"></button>
      <button class="rail-btn" id="btn-theme" title="Toggle theme"></button>
    </div>
  </nav>

  <aside id="sidebar" class="glass">
    <div class="side-panel" data-panel="connections" hidden>
      <div class="side-head"><div class="side-title">Connections</div><button class="btn sm primary" id="btn-new-conn"></button></div>
      <div class="side-scroll" id="conn-list"></div>
    </div>
    <div class="side-panel" data-panel="explorer" hidden><div id="explorer" class="side-panel-inner"></div></div>
    <div class="side-panel" data-panel="tools" hidden>
      <div class="side-head"><div class="side-title">Tools</div></div>
      <div class="side-scroll" id="tool-list"></div>
    </div>
    <div class="side-panel" data-panel="jobs" hidden>
      <div class="side-head"><div class="side-title">Jobs</div><button class="btn ghost xs icon" id="btn-refresh-jobs" title="Refresh"></button></div>
      <div class="side-scroll" id="job-list"></div>
    </div>
  </aside>

  <main id="main" class="glass">
    <header id="tabbar">
      <div id="tabs"></div>
      <div id="tab-indicator"></div>
      <div class="tab-actions"><button class="btn sm ghost" id="btn-new-query" title="New query (Alt+N)"></button></div>
    </header>
    <section id="tab-content"><div id="welcome" class="welcome"></div></section>
    <footer id="statusbar"></footer>
  </main>
  <div id="resizer" title="Drag to resize"></div>
</div>

<div id="toasts"></div>

<script src="/vendor/codemirror/lib/codemirror.js"></script>
<script src="/vendor/codemirror/mode/sql/sql.js"></script>
<script src="/vendor/codemirror/addon/hint/show-hint.js"></script>
<script src="/vendor/codemirror/addon/hint/sql-hint.js"></script>
<script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="/vendor/codemirror/addon/selection/active-line.js"></script>
<script type="module" src="/js/icons-init.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
